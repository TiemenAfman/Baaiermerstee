<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google" content="notranslate">
    <meta name="color-scheme" content="dark">
    <title>Baaiermerstee · Menukaart</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Creepster&family=Young+Serif&display=swap" rel="stylesheet">
    <style>
        /* ─────────────────────────────────────────────────────────────
           Baaiermerstee afhaalmenu · iiyama LH4375UHS in portrait
           Vaste stage van 2160 × 3840 px, wordt geschaald naar het scherm.
           De lucht volgt de echte zonnestand boven Bierum (53.42 N, 6.87 E).
           HALLOWEEN-THEMA: pompoenoranje accent, paarse lucht, vleermuizen,
           een heks die langs de maan vliegt, pompoenen, kale bomen, spinnenwebben
           en na zonsondergang dansende skeletten op het kerkhof.
           ───────────────────────────────────────────────────────────── */
        :root {
            --accent: #ff8c21;                 /* pompoenoranje: prijzen, koppen, kaartranden */
            --spook: #c7a4ff;                  /* heksenpaars voor kleine accenten */
            --ink: #f6f0e6;                    /* warm gebroken wit */
            --muted: rgba(246, 240, 230, 0.62);
            --ground-top: #3a2f4a;             /* wordt live gezet door JS */
            --ground-bottom: #231c30;
            --night: 0;                        /* 0 = dag, 1 = nacht; wordt live gezet door JS */
            --glow: 0.25;                      /* gloed van de pompoenen, idem */
            --serif: 'Young Serif', Georgia, 'Times New Roman', serif;
            --sans: 'Atkinson Hyperlegible', 'Segoe UI', Arial, sans-serif;
            --spooky: 'Creepster', 'Young Serif', Georgia, serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: var(--ground-bottom);
            cursor: none;
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
        }

        #stage {
            position: absolute;
            left: 0;
            top: 0;
            width: 2160px;
            height: 3840px;
            transform-origin: 0 0;
            overflow: hidden;
            color: var(--ink);
            font-family: var(--sans);
            background: linear-gradient(to bottom, var(--ground-top) 380px, var(--ground-bottom) 100%);
            -webkit-font-smoothing: antialiased;
        }

        /* ── LUCHT ─────────────────────────────────────────────── */
        .sky {
            position: absolute;
            left: 0; top: 0;
            width: 2160px;
            height: 380px;
            overflow: hidden;
            background: linear-gradient(to bottom, #46508a 0%, #8890b8 55%, #c8b8b8 100%);
        }

        .stars {
            position: absolute;
            left: 0; top: 0;
            width: 2160px;
            height: 380px;
            fill: #ffffff;
            opacity: 0;
        }

        .stars .tw { animation: twinkle 3.6s ease-in-out infinite alternate; }

        @keyframes twinkle {
            from { opacity: 0.25; }
            to   { opacity: 1; }
        }

        /* Halloween: een flinke oogstmaan (wel op zijn echte plek en in zijn echte fase) */
        .moon {
            position: absolute;
            left: 0; top: 0;
            width: 104px;
            height: 104px;
            opacity: 0;
            will-change: transform, opacity;
        }

        .moon .disc  { fill: #fbe8c4; }
        .moon .shade { fill: #fbe8c4; opacity: 0.12; }
        .moon svg    { filter: drop-shadow(0 0 22px rgba(251, 214, 150, 0.5)); }

        .sun {
            position: absolute;
            left: 0; top: 0;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: #fff3c9;
            will-change: transform, opacity;
        }

        .land {
            position: absolute;
            left: 0;
            bottom: -1px;
            width: 2160px;
            height: 300px;
            color: var(--ground-top);
            fill: currentColor;
        }

        .rotor { animation: spin 7s linear infinite; transform-origin: 0 0; }
        .rotor.r2 { animation-duration: 8.4s; animation-delay: -3s; }
        .rotor.r3 { animation-duration: 6.4s; animation-delay: -1.4s; }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── HALLOWEEN in de lucht ─────────────────────────────── */
        /* Verlichte ramen: gaan aan als het donker wordt (--night) */
        .land .lit { fill: #ffb347; opacity: var(--night); }

        /* Vleermuizen: vliegen (translateX), deinen (translateY) en klapperen (scaleY) */
        .bat {
            position: absolute;
            left: 0;
            animation: fly linear infinite;
            will-change: transform;
        }
        .bat .bob { animation: bob ease-in-out infinite alternate; }
        .bat svg {
            display: block;
            fill: #120a1a;
            stroke: rgba(199, 164, 255, 0.55);  /* randlicht: zichtbaar tegen de nachtlucht */
            stroke-width: 2.5;
            animation: flap 0.32s ease-in-out infinite alternate;
            transform-origin: 50% 40%;
        }
        @keyframes fly  { from { transform: translateX(-160px); } to { transform: translateX(2320px); } }
        @keyframes bob  { from { transform: translateY(-16px); } to { transform: translateY(16px); } }
        @keyframes flap { from { transform: scaleY(1); } to { transform: scaleY(0.3); } }

        /* De heks: vliegt eens in de twee minuten voorbij, op de hoogte van de maan (JS zet de baan) */
        .witch-lane {
            position: absolute;
            left: 0; top: 0;
            transition: transform 6s ease-in-out;
        }
        .witch {
            animation: witch 120s linear infinite;
            animation-delay: -104s;            /* eerste vlucht ±15 s na het laden */
            transform: translateX(-340px);
            will-change: transform;
        }
        .witch .bob { animation: bob 2.6s ease-in-out infinite alternate; }
        .witch svg  {
            display: block;
            width: 250px;
            height: 150px;
            fill: #120a1a;
            stroke: rgba(199, 164, 255, 0.5);
            stroke-width: 1.6;
        }
        @keyframes witch {
            0%   { transform: translateX(-340px); }
            15%  { transform: translateX(2200px); }
            100% { transform: translateX(2200px); }
        }

        /* Grondmist die langzaam over het dorp trekt */
        .mist {
            position: absolute;
            left: 0;
            bottom: 0;
            width: 3240px;
            height: 170px;
            background:
                radial-gradient(ellipse 520px 60px at 12% 78%, rgba(214, 196, 255, 0.26), rgba(214, 196, 255, 0) 100%),
                radial-gradient(ellipse 640px 70px at 38% 86%, rgba(214, 196, 255, 0.22), rgba(214, 196, 255, 0) 100%),
                radial-gradient(ellipse 480px 54px at 61% 80%, rgba(214, 196, 255, 0.24), rgba(214, 196, 255, 0) 100%),
                radial-gradient(ellipse 600px 66px at 86% 84%, rgba(214, 196, 255, 0.22), rgba(214, 196, 255, 0) 100%);
            animation: drift 90s ease-in-out infinite alternate;
            will-change: transform;
        }
        @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-1080px); } }

        /* Pompoenen met een flakkerend kaarsje */
        .pk { position: absolute; }
        .pk svg { position: relative; display: block; width: 100%; height: 100%; }
        .pk .glow {
            position: absolute;
            left: -90%; top: -90%;
            width: 280%; height: 280%;
            opacity: var(--glow);              /* door JS gezet: overdag zwak, 's avonds fel */
        }
        .pk .glow div {
            width: 100%; height: 100%;
            background: radial-gradient(circle closest-side, rgba(255, 150, 40, 0.55), rgba(255, 150, 40, 0.18) 45%, rgba(255, 150, 40, 0) 100%);
            animation: flicker 2.3s ease-in-out infinite alternate;
        }
        @keyframes flicker {
            0%   { opacity: 1; }
            30%  { opacity: 0.72; }
            55%  { opacity: 0.95; }
            80%  { opacity: 0.64; }
            100% { opacity: 0.9; }
        }

        /* Dansende skeletten op het kerkhof. Na zonsondergang (JS zet .awake) klimmen ze uit de
           grond; bij zonsopgang verstijven ze en zakken ze weer weg. Onder de grond staat de dans stil.
           Ledematen draaien om hun gewricht: elk lid is getekend vanaf (0,0) in een verschoven <g>. */
        .sk {
            position: absolute;
            overflow: hidden;                  /* onderrand = grondlijn: wat eronder zit, is weg */
        }
        .sk svg {
            display: block;
            transform: translateY(100%);
            transition: transform 3.5s ease-in;
            will-change: transform;
        }
        #skeletons.awake .sk svg {
            transform: translateY(0);
            transition: transform 4.5s ease-out;
        }
        .sk .hop, .sk .torso, .sk .head, .sk .arm, .sk .fore, .sk .thigh, .sk .shin {
            transform-origin: 0 0;
            animation-duration: 1.2s;
            animation-timing-function: ease-in-out;
            animation-iteration-count: infinite;
            animation-play-state: paused;
        }
        #skeletons.awake .sk g { animation-play-state: running; }
        .sk .hop  { animation-name: sk-hop; }
        .sk .head { animation-name: sk-nod; }
        .sk .alt  { animation-delay: -0.6s; }  /* rechterkant (gespiegeld) een halve maat later */
        .kick .torso { animation-name: kick-torso; }
        .kick .arm   { animation-name: kick-arm; }
        .kick .fore  { animation-name: kick-fore; }
        .kick .thigh { animation-name: kick-thigh; }
        .kick .shin  { animation-name: kick-shin; }
        .wave .torso { animation-name: wave-torso; }
        .wave .arm   { animation-name: wave-arm; }
        .wave .fore  { animation-name: wave-fore; }
        .wave .thigh { animation-name: wave-thigh; }
        .wave .shin  { animation-name: wave-shin; }
        @keyframes sk-hop { 0%, 50%, 100% { transform: translateY(0); } 25%, 75% { transform: translateY(-6px); } }
        @keyframes sk-nod { 0%, 100% { transform: rotate(-9deg); } 50% { transform: rotate(9deg); } }
        /* "kick": om en om een knie de lucht in, armen zwaaien tegengesteld */
        @keyframes kick-torso { 0%, 50%, 100% { transform: rotate(0); } 25% { transform: rotate(7deg); } 75% { transform: rotate(-7deg); } }
        @keyframes kick-arm   { 0%, 100% { transform: rotate(150deg); } 25% { transform: rotate(115deg); } 50% { transform: rotate(35deg); } 75% { transform: rotate(80deg); } }
        @keyframes kick-fore  { 0%, 100% { transform: rotate(-25deg); } 50% { transform: rotate(-80deg); } }
        @keyframes kick-thigh { 0%, 50%, 100% { transform: rotate(0); } 25% { transform: rotate(55deg); } }
        @keyframes kick-shin  { 0%, 50%, 100% { transform: rotate(0); } 25% { transform: rotate(-75deg); } }
        /* "wave": handen in de lucht, heupen heen en weer, knieën om en om */
        @keyframes wave-torso { 0%, 100% { transform: rotate(-8deg); } 50% { transform: rotate(8deg); } }
        @keyframes wave-arm   { 0%, 100% { transform: rotate(160deg); } 50% { transform: rotate(130deg); } }
        @keyframes wave-fore  { 0%, 100% { transform: rotate(-30deg); } 50% { transform: rotate(30deg); } }
        @keyframes wave-thigh { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(16deg); } }
        @keyframes wave-shin  { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(-30deg); } }

        .clock {
            position: absolute;
            right: 96px;
            top: 36px;
            text-align: right;
            text-shadow: 0 2px 28px rgba(0, 0, 0, 0.35), 0 1px 3px rgba(0, 0, 0, 0.25);
        }

        .clock .time {
            font-family: var(--serif);
            font-size: 84px;
            line-height: 1;
            font-weight: 400;
            font-variant-numeric: tabular-nums;
            letter-spacing: 0.01em;
        }

        .clock .date {
            font-size: 34px;
            line-height: 1.2;
            margin-top: 10px;
            color: rgba(246, 240, 230, 0.92);
        }

        /* ── TITELBAND ──────────────────────────────────────────── */
        .band {
            position: absolute;
            left: 0;
            top: 380px;
            width: 2160px;
            height: 220px;
            padding: 0 96px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .band h1 {
            font-family: var(--spooky);
            font-weight: 400;
            font-size: 176px;
            line-height: 1;
            letter-spacing: 0.02em;
            color: var(--accent);
            text-shadow: 0 4px 0 rgba(0, 0, 0, 0.35), 0 0 60px rgba(255, 140, 33, 0.25);
        }

        .band .eyebrow {
            font-size: 50px;
            font-weight: 700;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: var(--spook);
            padding-top: 18px;
        }

        /* ── MENUBORD ───────────────────────────────────────────── */
        .board {
            position: absolute;
            left: 0;
            top: 600px;
            width: 2160px;
            height: 3060px;
            padding: 0 72px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-column-gap: 48px;
            column-gap: 48px;
        }

        /* Geen flex-gap: oudere Android-WebViews (signage-SoC) kennen dat niet, dus marges */
        .col {
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .col > .card + .card { margin-top: 40px; }

        /* Kaarten groeien naar rato van hun aantal regels (flex-grow via JS),
           zodat de witruimte tussen regels in beide kolommen gelijk uitkomt. */
        .card {
            position: relative;
            display: flex;
            flex-direction: column;
            background-color: rgba(14, 5, 22, 0.42);
            background-repeat: no-repeat;
            background-position: top right;    /* spinnenweb (JS) in de hoek */
            border: 2px solid rgba(255, 140, 33, 0.20);
            border-radius: 32px;
            padding: 38px 46px 30px;
        }

        .card .rows {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card h2 {
            font-family: var(--serif);
            font-weight: 400;
            font-size: 66px;
            line-height: 1.05;
            color: var(--accent);
            padding-bottom: 16px;
            margin-bottom: 14px;
            border-bottom: 3px solid rgba(255, 140, 33, 0.38);
        }

        .row {
            display: flex;
            align-items: baseline;
            padding: 17px 0;
        }

        .row .n {
            font-size: 56px;
            line-height: 1.15;
            white-space: nowrap;   /* lange namen worden door JS iets verkleind */
            min-width: 0;
        }

        .row .n small {
            font-size: 38px;
            color: var(--muted);
            margin-left: 10px;
        }

        .row .l {
            flex: 1;
            min-width: 36px;
            margin: 0 20px;
            border-bottom: 3px dotted rgba(246, 240, 230, 0.26);
            transform: translateY(-12px);
        }

        .row .p {
            font-family: var(--serif);
            font-size: 58px;
            line-height: 1;
            font-weight: 400;
            color: var(--accent);
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
        }

        /* Spin aan een draadje onder het web van de Patat-kaart: draad rekt mee (scaleY), spin zakt mee */
        .card.spider::before,
        .card.spider::after {
            content: '';
            position: absolute;
            animation: 4.2s ease-in-out infinite alternate;
        }
        .card.spider::before {
            right: 98px;
            top: 0;
            width: 2px;
            height: 52px;
            background: rgba(246, 240, 230, 0.45);
            transform-origin: 50% 0;
            animation-name: thread;
        }
        .card.spider::after {
            right: 69px;
            top: 40px;
            width: 60px;
            height: 60px;
            background: var(--spider) no-repeat center / contain;
            animation-name: dangle;
        }
        @keyframes thread { from { transform: scaleY(1); }       to { transform: scaleY(1.3); } }
        @keyframes dangle { from { transform: translateY(0); }  to { transform: translateY(15.6px); } }

        /* Activiteit-kaart (Noaberschap) */
        .card.event {
            background-color: rgba(255, 140, 33, 0.10);
            border-color: rgba(255, 140, 33, 0.5);
            padding: 40px 46px 42px;
        }

        .event .label {
            font-size: 36px;
            font-weight: 700;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--accent);
        }

        .event h2 {
            border: 0;
            padding: 0;
            margin: 10px 0 12px;
            color: var(--ink);
            font-size: 78px;
        }

        .event .when {
            font-size: 46px;
            line-height: 1.3;
            color: rgba(246, 240, 230, 0.9);
        }

        .event .prices {
            display: flex;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .event .pill {
            display: flex;
            align-items: baseline;
            margin: 18px 18px 0 0;
            padding: 14px 26px;
            border-radius: 999px;
            border: 2px solid rgba(255, 140, 33, 0.55);
            background: rgba(5, 10, 18, 0.28);
            font-size: 38px;
            line-height: 1;
            white-space: nowrap;
        }

        .event .pill b {
            font-family: var(--serif);
            font-weight: 400;
            color: var(--accent);
            font-size: 42px;
            margin-left: 14px;
            font-variant-numeric: tabular-nums;
        }

        /* ?debug: uitlezing van viewport en schaal, voor het instellen van het display */
        .debug {
            position: absolute;
            left: 40px;
            top: 40px;
            z-index: 10;
            padding: 24px 32px;
            border-radius: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            font-size: 40px;
            line-height: 1.35;
            font-family: monospace;
            max-width: 1400px;
            word-break: break-all;
        }

        .event .note {
            margin-top: 26px;
            font-size: 36px;
            line-height: 1.3;
            color: var(--muted);
        }

        /* ── VOET ───────────────────────────────────────────────── */
        .foot {
            position: absolute;
            left: 0;
            bottom: 0;
            width: 2160px;
            height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .foot p {
            font-family: var(--serif);
            font-size: 58px;
            line-height: 1;
            color: rgba(246, 240, 230, 0.9);
            margin: 0 44px;
        }

        .foot .pk { position: relative; width: 104px; height: 96px; }

        @media (prefers-reduced-motion: reduce) {
            .rotor, .stars .tw, .bat, .bat .bob, .bat svg, .witch .bob, .mist, .pk .glow div,
            .card.spider::before, .card.spider::after, .sk g { animation: none; }
            .sk svg { transition: none; }
            .witch { display: none; }
        }

        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>
<div id="stage">

    <!-- ── LUCHT boven Bierum ─────────────────────────────────── -->
    <section class="sky" id="sky" aria-hidden="true">
        <svg class="stars" id="stars" viewBox="0 0 2160 380" xmlns="http://www.w3.org/2000/svg"></svg>

        <div class="moon" id="moon">
            <svg viewBox="-50 -50 100 100" xmlns="http://www.w3.org/2000/svg">
                <circle class="shade" r="44"/>
                <path class="disc" id="moonLit" d=""/>
            </svg>
        </div>

        <div class="sun" id="sun"></div>

        <!-- Silhouet van Bierum: wierde met de Sebastiaankerk en zijn steunbeer,
             kop-hals-rompboerderijen, bomen, de dijk en de turbines bij de Eemshaven -->
        <svg class="land" viewBox="0 0 2160 300" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
            <!-- dijk rechts -->
            <path d="M1440,300 C1700,272 1950,262 2160,266 L2160,300 Z"/>
            <!-- windturbines Eemshaven -->
            <g>
                <path d="M1864,268 L1872,268 L1870,178 L1866,178 Z"/>
                <g transform="translate(1868,178)"><g class="rotor r1">
                    <circle r="5"/>
                    <path d="M0,0 L-4,-8 L-2,-54 L2,-54 L4,-8 Z"/>
                    <path d="M0,0 L-4,-8 L-2,-54 L2,-54 L4,-8 Z" transform="rotate(120)"/>
                    <path d="M0,0 L-4,-8 L-2,-54 L2,-54 L4,-8 Z" transform="rotate(240)"/>
                </g></g>
                <path d="M1974,266 L1982,266 L1980,160 L1976,160 Z"/>
                <g transform="translate(1978,160)"><g class="rotor r2">
                    <circle r="5"/>
                    <path d="M0,0 L-4,-8 L-2,-58 L2,-58 L4,-8 Z"/>
                    <path d="M0,0 L-4,-8 L-2,-58 L2,-58 L4,-8 Z" transform="rotate(120)"/>
                    <path d="M0,0 L-4,-8 L-2,-58 L2,-58 L4,-8 Z" transform="rotate(240)"/>
                </g></g>
                <path d="M2084,266 L2092,266 L2090,184 L2086,184 Z"/>
                <g transform="translate(2088,184)"><g class="rotor r3">
                    <circle r="5"/>
                    <path d="M0,0 L-4,-8 L-2,-50 L2,-50 L4,-8 Z"/>
                    <path d="M0,0 L-4,-8 L-2,-50 L2,-50 L4,-8 Z" transform="rotate(120)"/>
                    <path d="M0,0 L-4,-8 L-2,-50 L2,-50 L4,-8 Z" transform="rotate(240)"/>
                </g></g>
            </g>
            <!-- wierde -->
            <path d="M300,300 C500,296 650,262 830,258 C1010,254 1180,290 1400,300 Z"/>
            <!-- kale Halloween-bomen links en rechts van de kerk: getekend door JS (buildTrees) -->
            <g id="trees" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"></g>
            <!-- boerderij 1: kop-hals-romp -->
            <path d="M424,300 L424,244 L449,214 L474,244 L474,300 Z"/>
            <rect x="441" y="208" width="8" height="16"/>
            <path d="M474,300 L474,252 L505,252 L505,300 Z"/>
            <path d="M505,300 L505,238 L610,148 L715,238 L715,300 Z"/>
            <!-- Sebastiaankerk: slanke toren met zadeldak (nok evenwijdig aan het schip, met pinakels),
                 de lange schuine steunbeer met boogdoorgang tegen de toren, en het romaanse schip -->
            <path fill-rule="evenodd" d="M708,262 L708,256 L828,121 L828,262 Z M768,262 L768,236 A28,28 0 0 1 824,236 L824,262 Z"/>
            <path d="M828,262 L828,52 L886,52 L886,262 Z"/>
            <path d="M826,54 L838,19 L876,19 L888,54 Z"/>
            <rect x="838" y="5" width="2" height="15"/>
            <rect x="872" y="12" width="4" height="8"/>
            <path d="M886,262 L886,178 L1088,178 L1088,262 Z"/>
            <path d="M886,180 L886,140 L1064,140 L1093,180 Z"/>
            <path d="M700,300 L700,262 L1100,262 L1100,300 Z"/>
            <!-- kerkhof bij de Sebastiaankerk -->

    const svgURL = svg => `url("data:image/svg+xml,${encodeURIComponent(svg)}")`;

    function webSVG(S) {
        /* draden vanuit de hoek rechtsboven, ringen die naar de hoek toe doorzakken */
        const angles = [2, 17, 33, 50, 67, 88].map(a => a * Math.PI / 180);

        angles.forEach(a => { const [x, y] = pt(a, S * 0.98); d += `M${S},0 L${x.toFixed(1)},${y.toFixed(1)} `; });

            const r = S * f;
            for (let i = 0; i < angles.length - 1; i++) {
                const [x1, y1] = pt(angles[i], r), [x2, y2] = pt(angles[i + 1], r);
                const [cx, cy] = pt((angles[i] + angles[i + 1]) / 2, r * 0.8);
                d += `M${x1.toFixed(1)},${y1.toFixed(1)} Q${cx.toFixed(1)},${cy.toFixed(1)} ${x2.toFixed(1)},${y2.toFixed(1)} `;

        return `<svg xmlns="http://www.w3.org/2000/svg" width="${S}" height="${S}" viewBox="0 0 ${S} ${S}"><path d="${d}" fill="none" stroke="rgba(246,240,230,0.34)" stroke-width="2"/></svg>`;
    }

    const SPIDER = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">'
        + '<g fill="none" stroke="#e8def7" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">'

        + '<circle cx="24" cy="18" r="9" fill="#e8def7"/><circle cx="24" cy="31" r="5.5" fill="#e8def7"/>'
        + '<circle cx="22" cy="32.5" r="1.4" fill="#ff8c21"/><circle cx="26" cy="32.5" r="1.4" fill="#ff8c21"/></svg>';

    /* ── Stage schalen naar het scherm ─────────────────────────────
       ?rotate=auto (standaard): staand beeldvlak → rechtop; liggend beeldvlak → stage 90° gedraaid,

    const ua = navigator.userAgent || '';
    const isDesktop = /Windows NT|Macintosh/i.test(ua);
    const rotParam = params.get('rotate');
    const debugEl = params.has('debug') ? document.createElement('div') : null;

    /* Het werkelijk zichtbare deel (visualViewport), zodat ook een ingezoomde WebView het hele bord toont */
    function viewport() {
        const vv = window.visualViewport;
        let w = innerWidth, h = innerHeight, x = 0, y = 0;
        if (vv && vv.width > 0 && vv.height > 0) {
            w = vv.width; h = vv.height;
            x = vv.pageLeft || vv.offsetLeft || 0;
            y = vv.pageTop || vv.offsetTop || 0;
        }
        if (!w || !h) { w = document.documentElement.clientWidth; h = document.documentElement.clientHeight; }
        return { w, h, x, y };
    }

    function chooseRotation(w, h) {
        if (rotParam !== null && rotParam !== '' && rotParam !== 'auto') {
            return ((parseInt(rotParam, 10) || 0) % 360 + 360) % 360;
        }
        return (w > h && !isDesktop) ? 90 : 0;
    }

    function fit() {
        const { w, h, x, y } = viewport();
        const rotate = chooseRotation(w, h);
        const sideways = rotate === 90 || rotate === 270;
        const sw = sideways ? H : W, sh = sideways ? W : H;
        const s = Math.min(w / sw, h / sh);
        const tx = x + (w - sw * s) / 2, ty = y + (h - sh * s) / 2;
        let t = `translate(${tx}px, ${ty}px) scale(${s})`;
        if (rotate === 90) t += ` translate(${H}px, 0) rotate(90deg)`;
        else if (rotate === 180) t += ` translate(${W}px, ${H}px) rotate(180deg)`;
        else if (rotate === 270) t += ` translate(0, ${W}px) rotate(-90deg)`;
        stage.style.transform = t;
        if (debugEl) {
            const vv = window.visualViewport;
            const de = document.documentElement;
            debugEl.textContent =
                `zichtbaar ${Math.round(w)}×${Math.round(h)} @${Math.round(x)},${Math.round(y)}`
                + ` · inner ${innerWidth}×${innerHeight}`
                + (vv ? ` · vv ${Math.round(vv.width)}×${Math.round(vv.height)} zoom ${vv.scale.toFixed(2)}` : ' · geen visualViewport')
                + ` · client ${de.clientWidth}×${de.clientHeight}`
                + ` · screen ${screen.width}×${screen.height} · dpr ${devicePixelRatio}`
                + ` · rotate ${rotate}${rotParam === null ? ' (auto)' : ''} · schaal ${s.toFixed(3)}`
                + ` · ${ua}`;
        }
    }
    addEventListener('resize', fit);
    addEventListener('orientationchange', fit);
    if (window.visualViewport) {
        visualViewport.addEventListener('resize', fit);
        visualViewport.addEventListener('scroll', fit);
    }
    fit();
    /* Sommige WebViews melden pas na het laden de juiste afmetingen */
    setTimeout(fit, 500);
    setTimeout(fit, 2500);

    /* ── Tijd: live, vast (?t=21:30 of ?t=2026-12-21T16:00) of demo (?demo) ── */
    let mode = 'live', fixed = null;
    const demoStart = Date.now();
    const tParam = params.get('t');
    if (tParam) {
        let d;
        if (/^\d{1,2}:\d{2}$/.test(tParam)) {
            const [h, m] = tParam.split(':').map(Number);
            d = new Date(); d.setHours(h, m, 0, 0);

    function now() {

    /* ── Zon en maan (naar SunCalc, Vladimir Agafonkin, BSD) ───── */
    const rad = Math.PI / 180, DEG = 180 / Math.PI;
    const dayMs = 86400000, J1970 = 2440588, J2000 = 2451545, e = rad * 23.4397;
    const toDays = date => date / dayMs - 0.5 + J1970 - J2000;
    const rightAscension = (l, b) => Math.atan2(Math.sin(l) * Math.cos(e) - Math.tan(b) * Math.sin(e), Math.cos(l));
    const declination = (l, b) => Math.asin(Math.sin(b) * Math.cos(e) + Math.cos(b) * Math.sin(e) * Math.sin(l));
    const azimuth = (Hh, phi, dec) => Math.atan2(Math.sin(Hh), Math.cos(Hh) * Math.sin(phi) - Math.tan(dec) * Math.cos(phi));
    const altitude = (Hh, phi, dec) => Math.asin(Math.sin(phi) * Math.sin(dec) + Math.cos(phi) * Math.cos(dec) * Math.cos(Hh));
    const siderealTime = (d, lw) => rad * (280.16 + 360.9856235 * d) - lw;

    function sunCoords(d) {
        const M = rad * (357.5291 + 0.98560028 * d);
        const L = M + rad * (1.9148 * Math.sin(M) + 0.02 * Math.sin(2 * M) + 0.0003 * Math.sin(3 * M)) + rad * 102.9372 + Math.PI;
        return { dec: declination(L, 0), ra: rightAscension(L, 0) };
    }

    function moonCoords(d) {
        const L = rad * (218.316 + 13.176396 * d), M = rad * (134.963 + 13.064993 * d), F = rad * (93.272 + 13.229350 * d);
        const l = L + rad * 6.289 * Math.sin(M), b = rad * 5.128 * Math.sin(F), dt = 385001 - 20905 * Math.cos(M);
        return { ra: rightAscension(l, b), dec: declination(l, b), dist: dt };
    }

    function position(date, coords) {
        const lw = rad * -LON, phi = rad * LAT, d = toDays(date), c = coords(d), Hh = siderealTime(d, lw) - c.ra;
        const az = ((azimuth(Hh, phi, c.dec) * DEG + 180) % 360 + 360) % 360;   /* 0 = noord, 90 = oost */
        return { az, alt: altitude(Hh, phi, c.dec) * DEG };
    }
    const sunPosition = date => position(date, sunCoords);
    const moonPosition = date => position(date, moonCoords);

    function moonPhase(date) {
        const d = toDays(date), s = sunCoords(d), m = moonCoords(d), sdist = 149598000;
        const phi = Math.acos(Math.sin(s.dec) * Math.sin(m.dec) + Math.cos(s.dec) * Math.cos(m.dec) * Math.cos(s.ra - m.ra));
        const inc = Math.atan2(sdist * Math.sin(phi), m.dist - sdist * Math.cos(phi));
        const angle = Math.atan2(Math.cos(s.dec) * Math.sin(s.ra - m.ra),
            Math.sin(s.dec) * Math.cos(m.dec) - Math.cos(s.dec) * Math.sin(m.dec) * Math.cos(s.ra - m.ra));
        return 0.5 + 0.5 * inc * (angle < 0 ? -1 : 1) / Math.PI;
    }

    /* ── Kleuren ───────────────────────────────────────────────── */
    const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
    const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
    const toHex = c => '#' + c.map(v => Math.round(clamp(v, 0, 255)).toString(16).padStart(2, '0')).join('');
    const mix = (a, b, f) => toHex(hex(a).map((v, i) => v + (hex(b)[i] - v) * f));
    const rgba = (h, a) => { const [r, g, b] = hex(h); return `rgba(${r},${g},${b},${a.toFixed(3)})`; };

    /* [zonshoogte °, zenit, midden, horizon, bord boven, bord onder]
       Halloween: paars-violette nacht met een gloeiende horizon, felle oranje schemering
       en overdag een bleke, wat onheilspellende herfstlucht. Het bord blijft aubergine. */
    const SKY = [
        [-18, '#0b0518', '#1c0c34', '#3a1650', '#130c1c', '#07050c'],
        [-12, '#110726', '#25103e', '#4a1c58', '#170f22', '#0a0710'],
        [ -7, '#1c0b38', '#3a1652', '#77284e', '#1c1428', '#0e0a15'],
        [ -3, '#2a1350', '#5c2268', '#c8442c', '#22182f', '#120e1b'],

        [  4, '#472f6c', '#9a5876', '#f59a48', '#312640', '#1c1728'],
        [ 10, '#4a4680', '#8a78a0', '#e6b47c', '#352a45', '#1f192c'],
        [ 22, '#484f88', '#8a8cb2', '#d2bca8', '#382d48', '#211a2e'],

    ];

    function skyColours(alt) {
        if (alt <= SKY[0][0]) return SKY[0].slice(1);
        if (alt >= SKY[SKY.length - 1][0]) return SKY[SKY.length - 1].slice(1);
        for (let i = 0; i < SKY.length - 1; i++) {
            const a = SKY[i], b = SKY[i + 1];
            if (alt >= a[0] && alt <= b[0]) {
                const f = (alt - a[0]) / (b[0] - a[0]);
                return a.slice(1).map((c, j) => mix(c, b[j + 1], f));
            }
        }
        return SKY[SKY.length - 1].slice(1);
    }

    function sunColour(alt) {
        if (alt > 15) return '#fff3c9';
        if (alt > 4) return mix('#ffcf6a', '#fff3c9', (alt - 4) / 11);
        return mix('#ff7538', '#ffcf6a', clamp((alt + 2) / 6, 0, 1));
    }

    /* ── Sterren (vaste seed, dus elke keer dezelfde hemel) ─────── */
    (function buildStars() {
        let a = 53416867;
        const rnd = () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
        let s = '';
        for (let i = 0; i < 190; i++) {
            const x = rnd() * W, y = Math.pow(rnd(), 1.35) * (SKY_H - 65);
            const bright = rnd() < 0.12;
            const r = bright ? 2.6 + rnd() * 1.4 : 1.2 + rnd() * 1.4;
            const o = 0.45 + rnd() * 0.5;
            const tw = rnd() < 0.25;
            s += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r.toFixed(1)}" opacity="${o.toFixed(2)}"${tw ? ` class="tw" style="animation-delay:${(-rnd() * 6).toFixed(2)}s"` : ''}/>`;
        }
        starsEl.innerHTML = s;
    })();

    /* ── Halloween-decor in de lucht ───────────────────────────── */
    /* Kale, kronkelige bomen (vaste seed, dus elke keer dezelfde) */
    (function buildTrees() {
        let a = 31102026;
        const rnd = () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
        const WIDTH = [10, 6.5, 4.2, 2.6, 1.6];
        const paths = WIDTH.map(() => '');
        function branch(x1, y1, len, ang, depth) {
            const x2 = x1 + Math.sin(ang) * len, y2 = y1 - Math.cos(ang) * len;
            const bend = (rnd() - 0.5) * len * 0.35;
            const cx = (x1 + x2) / 2 + Math.cos(ang) * bend, cy = (y1 + y2) / 2 + Math.sin(ang) * bend;
            paths[depth] += `M${x1.toFixed(1)},${y1.toFixed(1)} Q${cx.toFixed(1)},${cy.toFixed(1)} ${x2.toFixed(1)},${y2.toFixed(1)} `;
            if (depth === WIDTH.length - 1) return;
            const n = depth === 0 ? 3 : 2;
            for (let i = 0; i < n; i++) {
                const spread = n === 3 ? (i - 1) * 0.62 : (i ? 1 : -1) * (0.32 + rnd() * 0.38);
                branch(x2, y2, len * (0.6 + rnd() * 0.14), ang + spread + (rnd() - 0.5) * 0.3, depth + 1);
            }
        }
        /* [voet x, hoogte] — op de plekken van de oude bolle bomen */
        const TREES = [[170, 100], [241, 128], [320, 104], [1130, 104], [1192, 132], [1262, 112], [1322, 88]];
        TREES.forEach(([x, h]) => branch(x, 300, h * 0.36, (rnd() - 0.5) * 0.14, 0));
        /* één pad per tak-niveau, met aflopende lijndikte */
        document.getElementById('trees').innerHTML = paths.map((d, i) =>
            `<path d="${d}" stroke-width="${WIDTH[i]}"/>`).join('');
    })();

    /* Vleermuizen: [hoogte, breedte, vliegduur s, vertraging s, deinduur s, omgekeerd?] */
    (function buildBats() {
        const BATS = [
            [ 96, 64, 24,  -3, 2.8, 0], [168, 46, 31, -17, 3.4, 1], [215, 58, 27, -11, 2.2, 0],
            [128, 40, 38, -26, 3.9, 1], [ 56, 50, 34,  -6, 3.1, 1], [190, 72, 22, -15, 2.6, 0],
            [240, 44, 29, -21, 3.6, 1],
        ];
        const shape = '<path d="M46,20 C38,14 22,8 4,6 C10,12 12,18 10,24 C16,20 22,22 24,28 C28,23 34,24 37,30 C40,26 44,27 46,30 Z"/>'
            + '<path d="M54,20 C62,14 78,8 96,6 C90,12 88,18 90,24 C84,20 78,22 76,28 C72,23 66,24 63,30 C60,26 56,27 54,30 Z"/>'
            + '<ellipse cx="50" cy="24" rx="5.5" ry="10"/><circle cx="50" cy="13" r="5"/>'
            + '<path d="M45.5,12 L46,4 L49,10 Z M54.5,12 L54,4 L51,10 Z"/>';
        document.getElementById('bats').innerHTML = BATS.map(([y, w, dur, delay, bob, rev], i) =>
            `<div class="bat" style="top:${y}px;animation-duration:${dur}s;animation-delay:${delay}s${rev ? ';animation-direction:reverse' : ''}">`
            + `<div class="bob" style="animation-duration:${bob}s;animation-delay:${(-i * 0.7).toFixed(1)}s">`
            + `<svg viewBox="0 0 100 50" width="${w}" height="${w / 2}" style="animation-delay:${(-i * 0.13).toFixed(2)}s">${shape}</svg>`
            + '</div></div>').join('');
    })();

    /* Pompoen met uitgesneden gezicht (ook gebruikt in de voet) */
    const PUMPKIN = '<svg viewBox="-32 -30 64 58" xmlns="http://www.w3.org/2000/svg">'
        + '<path d="M-3,-15 C-3,-21 -1,-25 4,-28 L7,-25 C3,-22 3,-19 3,-15 Z" fill="#5d6b2c"/>'
        + '<ellipse cx="-12" cy="6" rx="15" ry="19" fill="#c4501a"/><ellipse cx="12" cy="6" rx="15" ry="19" fill="#c4501a"/>'
        + '<ellipse cx="-5" cy="5" rx="13" ry="21" fill="#e0661c"/><ellipse cx="5" cy="5" rx="13" ry="21" fill="#e0661c"/>'
        + '<ellipse cx="0" cy="5" rx="8" ry="22" fill="#ee7a26"/>'
        + '<g fill="#ffd54a"><path d="M-14,-1 L-5,-1 L-9.5,-9 Z M5,-1 L14,-1 L9.5,-9 Z M-2.5,6 L2.5,6 L0,1.5 Z"/>'
        + '<path d="M-15,9 Q0,24 15,9 Q11,12 8,11.5 L6,15 L3,12.5 L-3,12.5 L-6,15 L-8,11.5 Q-11,12 -15,9 Z"/></g></svg>';
    const pumpkinHTML = '<div class="glow"><div></div></div>' + PUMPKIN;

    (function buildPumpkins() {
        /* [midden x, breedte] — staan op de grondlijn van het silhouet */
        const PUMPKINS = [[390, 80], [1108, 62], [1385, 88], [1800, 70]];
        document.getElementById('pumpkins').innerHTML = PUMPKINS.map(([x, w], i) => {
            const h = w * 58 / 64;
            return `<div class="pk" style="left:${x - w / 2}px;top:${SKY_H - 1 - h}px;width:${w}px;height:${h}px">`
                + pumpkinHTML.replace('<div></div>', `<div style="animation-delay:${(-i * 0.9).toFixed(1)}s"></div>`) + '</div>';
        }).join('');
        document.querySelectorAll('.foot .pk').forEach(el => { el.innerHTML = pumpkinHTML; });
    })();

    /* Dansende skeletten op het kerkhof. Tekening rond het bekken (0,0); de rechterarm en het
       rechterbeen zijn gespiegelde kopieën van links (.alt = een halve maat later). */
    const skelEl = document.getElementById('skeletons');
    (function buildSkeletons() {
        /* [midden x, dans, gespiegeld?, vertraging bij opstaan/wegzakken s] */
        const SKELETONS = [[1188, 'kick', 0, 0.6], [1256, 'wave', 0, 0], [1324, 'kick', 1, 1.3]];
        const S = 0.9, VW = 108, VH = 130;     /* viewBox -54 -90 108 130, voeten op y ≈ 39 */
        const BONE = '#ece2cc', HOLE = '#140b1e';
        const leg = alt => `<g class="thigh${alt}"><path d="M0,0 L0,19" stroke-width="4.4"/>`
            + `<g transform="translate(0,19)"><g class="shin${alt}"><path d="M0,0 L0,18 L-5,19" stroke-width="4"/></g></g></g>`;
        const arm = alt => `<g class="arm${alt}"><path d="M0,0 L0,15" stroke-width="4"/>`
            + `<g transform="translate(0,15)"><g class="fore${alt}"><path d="M0,0 L0,12" stroke-width="3.6"/>`
            + '<circle cy="14.5" r="3.1" stroke="none"/></g></g></g>';
        const body = `<g class="hop" fill="${BONE}" stroke="${BONE}" stroke-linecap="round" stroke-linejoin="round">`
            + `<g transform="translate(-5,-1)">${leg('')}</g><g transform="translate(5,-1) scale(-1,1)">${leg(' alt')}</g>`
            + '<path d="M-9,-6 Q0,-10 9,-6 L7,2 Q0,-1 -7,2 Z" stroke-width="1.5"/>'
            + '<g class="torso"><g fill="none">'
            + '<path d="M0,-4 L0,-50" stroke-width="3.2"/>'
            + '<path d="M-8,-41 Q0,-47 8,-41 M-9,-35.5 Q0,-41.5 9,-35.5 M-8.5,-30 Q0,-36 8.5,-30 M-7,-24.5 Q0,-30 7,-24.5" stroke-width="2.6"/>'
            + '<path d="M-11,-46 Q0,-49 11,-46" stroke-width="3.4"/></g>'
            + `<g transform="translate(-11,-46)">${arm('')}</g><g transform="translate(11,-46) scale(-1,1)">${arm(' alt')}</g>`
            + '<g transform="translate(0,-50)"><g class="head" stroke="none">'
            + '<path d="M-5.5,-5 L5.5,-5 L4.2,0 L-4.2,0 Z"/><ellipse cy="-11" rx="9" ry="9.5"/>'
            + `<g fill="${HOLE}"><circle cx="-3.6" cy="-11" r="2.7"/><circle cx="3.6" cy="-11" r="2.7"/><path d="M0,-7.6 L-1.4,-5 L1.4,-5 Z"/></g>`
            + '</g></g></g></g>';
        skelEl.innerHTML = SKELETONS.map(([x, dance, mirror, delay]) => {
            const w = VW * S, h = VH * S;
            return `<div class="sk ${dance}" style="left:${(x - w / 2).toFixed(1)}px;top:${(SKY_H - 2 - h).toFixed(1)}px">`
                + `<svg viewBox="${-VW / 2} -90 ${VW} ${VH}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" style="transition-delay:${delay}s">`
                + (mirror ? `<g transform="scale(-1,1)">${body}</g>` : body) + '</svg></div>';
        }).join('');
    })();

    function drawMoon(p) {
        const r = 44, t = Math.cos(2 * Math.PI * p), rx = Math.max(0.5, Math.abs(t) * r);
        const d = p < 0.5
            ? `M0,${-r} A${r},${r} 0 0 1 0,${r} A${rx.toFixed(2)},${r} 0 0 ${t > 0 ? 0 : 1} 0,${-r} Z`
            : `M0,${-r} A${r},${r} 0 0 0 0,${r} A${rx.toFixed(2)},${r} 0 0 ${t > 0 ? 1 : 0} 0,${-r} Z`;
        moonLit.setAttribute('d', d);
    }

    const fmtTime = d => d ? d.toLocaleTimeString('nl-NL', { hour: '2-digit', minute: '2-digit' }) : '--:--';
    const fmtDate = d => d.toLocaleDateString('nl-NL', { weekday: 'long', day: 'numeric', month: 'long' });

    /* Azimut 40°..320° (NO tot NW) → volle breedte; hoogte 0..62° → horizon tot boven */
    const skyX = az => clamp((az - 40) / 280, -0.06, 1.06) * W;
    const skyY = alt => SKY_H - (alt / 62) * (SKY_H - SUN_TOP);

    let lastSkyMinute = -1;
    function render() {
        const t = now();
        timeEl.textContent = fmtTime(t);

        const minute = Math.floor(t.getTime() / 60000);
        if (minute === lastSkyMinute && mode !== 'demo') return;
        lastSkyMinute = minute;

        dateEl.textContent = fmtDate(t);
        const sun = sunPosition(t);
        const [zen, mid, hor, gTop, gBot] = skyColours(sun.alt);
        stage.style.setProperty('--ground-top', gTop);
        stage.style.setProperty('--ground-bottom', gBot);
        const night = clamp((-sun.alt + 1) / 8, 0, 1);
        stage.style.setProperty('--night', night.toFixed(3));
        stage.style.setProperty('--glow', (0.3 + 0.7 * night).toFixed(3));
        document.body.style.background = gBot;
        /* Zon onder (officiële zonsondergang, -0,833°): de skeletten komen dansen */
        skelEl.classList.toggle('awake', sun.alt < -0.833);

        const sx = skyX(sun.az), sy = skyY(sun.alt);
        const sc = sunColour(sun.alt);
        const low = 1 - clamp(sun.alt, 0, 18) / 18;
        const glowA = (0.26 + 0.36 * low) * clamp((sun.alt + 7) / 7, 0, 1);
        const glowR = 520 + 520 * low;
        const glow = glowA > 0.005
            ? `radial-gradient(circle ${glowR.toFixed(0)}px at ${sx.toFixed(0)}px ${sy.toFixed(0)}px, ${rgba(sc, glowA)} 0%, ${rgba(sc, glowA * 0.45)} 40%, ${rgba(sc, 0)} 100%), `
            : '';
        skyEl.style.background = `${glow}linear-gradient(to bottom, ${zen} 0%, ${mid} 55%, ${hor} 100%)`;

        sunEl.style.transform = `translate(${(sx - 50).toFixed(1)}px, ${(sy - 50).toFixed(1)}px)`;
        sunEl.style.background = sc;
        sunEl.style.boxShadow = `0 0 40px 14px ${rgba(sc, 0.55)}, 0 0 170px 60px ${rgba(sc, 0.22)}`;
        sunEl.style.opacity = clamp((sun.alt + 3.5) / 3.5, 0, 1).toFixed(3);

        starsEl.style.opacity = clamp((-sun.alt - 3) / 11, 0, 1).toFixed(3);

        const moon = moonPosition(t);
        const mx = skyX(moon.az), my = skyY(moon.alt);
        moonEl.style.transform = `translate(${(mx - 52).toFixed(1)}px, ${(my - 52).toFixed(1)}px)`;
        const moonVis = clamp((-sun.alt + 1) / 9, 0, 1) * clamp((moon.alt + 2) / 4, 0, 1);
        moonEl.style.opacity = moonVis.toFixed(3);
        drawMoon(moonPhase(t));

        /* De heks vliegt langs de maan als die op is, anders op een vaste hoogte boven het dorp */
        const laneY = moonVis > 0.3 && moon.alt > 3 ? clamp(my - 88, 10, 190) : 60;
        witchLane.style.transform = `translateY(${laneY.toFixed(0)}px)`;
    }

    render();
    setInterval(render, mode === 'demo' ? 100 : 1000);

    /* ── Stil controleren op wijzigingen (CHECK_MINUTES bovenin) ──
       Haalt index.html op de achtergrond op en vergelijkt met de versie die bij het laden gold.
       Pas als dezelfde nieuwe versie twee keer achter elkaar wordt gezien (dus niet bij een
       CDN-hik) wordt de pagina met een verse URL herladen. Geen wijziging = geen herlaad, geen flits. */
    if (mode === 'live' && CHECK_MINUTES > 0) {
        let baseline = null, pending = null;
        const fetchSource = () =>
            fetch(location.pathname + '?check=' + Date.now(), { cache: 'no-store' })
                .then(r => (r.ok ? r.text() : null))
                .catch(() => null);
        const check = () => fetchSource().then(src => {
            if (!src) return;                               /* offline of fout: volgende keer opnieuw */
            if (baseline === null) { baseline = src; return; }
            if (src === baseline) { pending = null; return; }
            if (pending === src) {
                const u = new URL(location.href);
                u.searchParams.set('v', Date.now().toString(36));
                location.replace(u.href);
            } else {
                pending = src;
            }
        });
        check();
        setInterval(check, CHECK_MINUTES * 60 * 1000);
    }
})();
</script>
</body>
</html>
