<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google" content="notranslate">
    <meta name="color-scheme" content="dark">
    <title>Baaiermerstee · Afhaalmenu</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Young+Serif&display=swap" rel="stylesheet">
    <style>
        /* ─────────────────────────────────────────────────────────────
           Baaiermerstee afhaalmenu · iiyama LH4375UHS in portrait
           Vaste stage van 2160 × 3840 px, wordt geschaald naar het scherm.
           De lucht volgt de echte zonnestand boven Bierum (53.42 N, 6.87 E).
           ───────────────────────────────────────────────────────────── */
        :root {
            --accent: #f9a825;                 /* huisstijl-geel: prijzen, koppen, zon */
            --ink: #f6f0e6;                    /* warm gebroken wit */
            --muted: rgba(246, 240, 230, 0.62);
            --ground-top: #3c4e5a;             /* wordt live gezet door JS */
            --ground-bottom: #27353e;
            --serif: 'Young Serif', Georgia, 'Times New Roman', serif;
            --sans: 'Atkinson Hyperlegible', 'Segoe UI', Arial, sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: var(--ground-bottom);
            cursor: none;
        }

        #stage {
            position: absolute;
            left: 0;
            top: 0;
            width: 2160px;
            height: 3840px;
            transform-origin: 0 0;
            overflow: hidden;
            color: var(--ink);
            font-family: var(--sans);
            background: linear-gradient(to bottom, var(--ground-top) 760px, var(--ground-bottom) 100%);
            -webkit-font-smoothing: antialiased;
        }

        /* ── LUCHT ─────────────────────────────────────────────── */
        .sky {
            position: absolute;
            left: 0; top: 0;
            width: 2160px;
            height: 760px;
            overflow: hidden;
            background: linear-gradient(to bottom, #2c6fb5 0%, #7db3dd 55%, #b6daef 100%);
        }

        .stars {
            position: absolute;
            left: 0; top: 0;
            width: 2160px;
            height: 760px;
            fill: #ffffff;
            opacity: 0;
        }

        .stars .tw { animation: twinkle 3.6s ease-in-out infinite alternate; }

        @keyframes twinkle {
            from { opacity: 0.25; }
            to   { opacity: 1; }
        }

        .moon {
            position: absolute;
            left: 0; top: 0;
            width: 90px;
            height: 90px;
            opacity: 0;
            will-change: transform, opacity;
        }

        .moon .disc  { fill: #f4efe0; }
        .moon .shade { fill: #f4efe0; opacity: 0.12; }
        .moon svg    { filter: drop-shadow(0 0 22px rgba(244, 239, 224, 0.45)); }

        .sun {
            position: absolute;
            left: 0; top: 0;
            width: 130px;
            height: 130px;
            border-radius: 50%;
            background: #fff3c9;
            will-change: transform, opacity;
        }

        .land {
            position: absolute;
            left: 0;
            bottom: -1px;
            width: 2160px;
            height: 300px;
            color: var(--ground-top);
            fill: currentColor;
        }

        .rotor { animation: spin 7s linear infinite; transform-origin: 0 0; }
        .rotor.r2 { animation-duration: 8.4s; animation-delay: -3s; }
        .rotor.r3 { animation-duration: 6.4s; animation-delay: -1.4s; }

        @keyframes spin { to { transform: rotate(360deg); } }

        .clock {
            position: absolute;
            right: 96px;
            top: 64px;
            text-align: right;
            text-shadow: 0 2px 28px rgba(0, 0, 0, 0.35), 0 1px 3px rgba(0, 0, 0, 0.25);
        }

        .clock .time {
            font-family: var(--serif);
            font-size: 112px;
            line-height: 1;
            font-weight: 400;
            font-variant-numeric: tabular-nums;
            letter-spacing: 0.01em;
        }

        .clock .date {
            font-size: 42px;
            line-height: 1.2;
            margin-top: 14px;
            color: rgba(246, 240, 230, 0.92);
        }

        .clock .suntimes {
            font-size: 34px;
            line-height: 1.2;
            margin-top: 10px;
            color: rgba(246, 240, 230, 0.7);
            font-variant-numeric: tabular-nums;
        }

        /* ── TITELBAND ──────────────────────────────────────────── */
        .band {
            position: absolute;
            left: 0;
            top: 760px;
            width: 2160px;
            height: 220px;
            padding: 0 96px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .band h1 {
            font-family: var(--serif);
            font-weight: 400;
            font-size: 150px;
            line-height: 1;
            letter-spacing: -0.012em;
            color: var(--ink);
            text-shadow: 0 3px 0 rgba(0, 0, 0, 0.18);
        }

        .band .eyebrow {
            font-size: 50px;
            font-weight: 700;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: var(--accent);
            padding-top: 18px;
        }

        /* ── MENUBORD ───────────────────────────────────────────── */
        .board {
            position: absolute;
            left: 0;
            top: 980px;
            width: 2160px;
            height: 2680px;
            padding: 0 72px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 48px;
        }

        .col {
            display: flex;
            flex-direction: column;
            gap: 40px;
            min-height: 0;
        }

        /* Kaarten groeien naar rato van hun aantal regels (flex-grow via JS),
           zodat de witruimte tussen regels in beide kolommen gelijk uitkomt. */
        .card {
            display: flex;
            flex-direction: column;
            background: rgba(5, 10, 18, 0.40);
            border: 2px solid rgba(249, 168, 37, 0.20);
            border-radius: 32px;
            padding: 38px 46px 30px;
        }

        .card .rows {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card h2 {
            font-family: var(--serif);
            font-weight: 400;
            font-size: 66px;
            line-height: 1.05;
            color: var(--accent);
            padding-bottom: 16px;
            margin-bottom: 14px;
            border-bottom: 3px solid rgba(249, 168, 37, 0.38);
        }

        .row {
            display: flex;
            align-items: baseline;
            gap: 20px;
            padding: 17px 0;
        }

        .row .n {
            font-size: 52px;
            line-height: 1.15;
            white-space: nowrap;   /* lange namen worden door JS iets verkleind */
            min-width: 0;
        }

        .row .n small {
            font-size: 38px;
            color: var(--muted);
            margin-left: 10px;
        }

        .row .l {
            flex: 1;
            min-width: 36px;
            border-bottom: 3px dotted rgba(246, 240, 230, 0.26);
            transform: translateY(-12px);
        }

        .row .p {
            font-family: var(--serif);
            font-size: 54px;
            line-height: 1;
            font-weight: 400;
            color: var(--accent);
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
        }

        /* Activiteit-kaart (Noaberschap) */
        .card.event {
            background: rgba(249, 168, 37, 0.10);
            border-color: rgba(249, 168, 37, 0.5);
            padding: 40px 46px 42px;
        }

        .event .label {
            font-size: 36px;
            font-weight: 700;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--accent);
        }

        .event h2 {
            border: 0;
            padding: 0;
            margin: 10px 0 12px;
            color: var(--ink);
            font-size: 78px;
        }

        .event .when {
            font-size: 46px;
            line-height: 1.3;
            color: rgba(246, 240, 230, 0.9);
        }

        .event .prices {
            display: flex;
            gap: 18px;
            margin-top: 28px;
            flex-wrap: wrap;
        }

        .event .pill {
            display: flex;
            align-items: baseline;
            gap: 14px;
            padding: 14px 26px;
            border-radius: 999px;
            border: 2px solid rgba(249, 168, 37, 0.55);
            background: rgba(5, 10, 18, 0.28);
            font-size: 38px;
            line-height: 1;
            white-space: nowrap;
        }

        .event .pill b {
            font-family: var(--serif);
            font-weight: 400;
            color: var(--accent);
            font-size: 42px;
            font-variant-numeric: tabular-nums;
        }

        .event .note {
            margin-top: 26px;
            font-size: 36px;
            line-height: 1.3;
            color: var(--muted);
        }

        /* ── VOET ───────────────────────────────────────────────── */
        .foot {
            position: absolute;
            left: 0;
            bottom: 0;
            width: 2160px;
            height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .foot p {
            font-family: var(--serif);
            font-size: 58px;
            line-height: 1;
            color: rgba(246, 240, 230, 0.9);
        }

        @media (prefers-reduced-motion: reduce) {
            .rotor, .stars .tw { animation: none; }
        }

        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>

        <div class="clock">

    <!-- ── TITEL ──────────────────────────────────────────────── -->

    <!-- ── MENU ───────────────────────────────────────────────── -->

<script>
/* ═══════════════════════════════════════════════════════════════
   MENU — pas hier prijzen en items aan.
   Een item is [naam, prijs] of [naam, prijs, toelichting].
   ═══════════════════════════════════════════════════════════════ */
const MENU = {
    left: [
        { title: 'Snacks', items: [
            ['Frikandel', '2,25'],
            ['Frikandel speciaal', '2,50'],
            ['Kroket', '2,25'],
            ['Boerenbrok', '2,75'],
            ['Bamischijf', '2,50'],
            ['Hamburger', '2,25'],
            ['Broodje hamburger', '2,75'],
            ['Broodje hamburger speciaal', '4,00'],
            ['Kipnuggets', '2,50', '6 stuks'],
            ['Kaassouflé', '2,25'],
            ['Pikanto', '2,50'],
            ['Kipcorn', '2,50'],
        ]},
        { title: 'Borrelhapjes', items: [
            ['Borrelmix', '3,50', '8 stuks'],
            ['Bitterballen', '2,75', '8 stuks'],
            ['Borrelmix luxe', '5,50', '6 stuks'],
            ['Bitterballen luxe', '5,50', '8 stuks'],
        ]},
    ],
    right: [
        { title: 'Patat', items: [
            ['Patat', '2,50'],
            ['Patat speciaal', '3,00'],
            ['Patat oorlog', '3,25'],
            ['Gezinszak', '10,00', '4 pers.'],
        ]},
        { title: 'Sauzen', items: [
            ['Mayo / curry / ketchup', '0,50'],
            ['Satésaus / joppiesaus', '0,60'],
            ['Bakje satésaus', '1,50'],
        ]},
        { title: 'Dranken', items: [
            ['Koffie / thee', '1,50'],
            ['Fris', '2,00'],
            ['Bier van de tap', '2,25'],
            ['Bier uit fles', '2,75'],
            ['Alcoholvrij bier', '2,75'],
            ['Wijnen', '3,00'],
            ['Advocaat', '3,50'],
            ['Pasoa jus', '4,00'],
            ['Cola beerenburg', '4,00'],
            ['Sinas beerenburg', '4,00'],
            ['Cola malibu', '4,00'],
        ]},
    ],
};

/* Activiteit-kaart onder in de linkerkolom. Zet show op false om te verbergen. */
const EVENT = {
    show: true,
    label: 'Noaberschap',
    title: 'Samen eten',
    when: 'Elke vierde woensdag van de maand',
    prices: [['Volwassenen', '10,00'], ['Kinderen', '6,50']],
    note: 'Verdere consumpties zijn voor eigen rekening.',
};

/* ═══════════════════════════════════════════════════════════════
   Locatie voor de zonnestand: dorpshuis Baaiermerstee, Bierum
   ═══════════════════════════════════════════════════════════════ */
const LAT = 53.4167, LON = 6.8667;

(function () {
    'use strict';

    const W = 2160, H = 3840, SKY_H = 760, SUN_TOP = 110;
    const params = new URLSearchParams(location.search);
    const stage = document.getElementById('stage');
    const skyEl = document.getElementById('sky');
    const sunEl = document.getElementById('sun');
    const moonEl = document.getElementById('moon');
    const moonLit = document.getElementById('moonLit');
    const starsEl = document.getElementById('stars');
    const timeEl = document.getElementById('time');
    const dateEl = document.getElementById('date');
    const suntimesEl = document.getElementById('suntimes');

    /* ── Menu opbouwen ─────────────────────────────────────────── */
    function esc(s) {
        return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    }

    function cardHTML(section) {
        const rows = section.items.map(([name, price, note]) =>
            `<div class="row"><span class="n">${esc(name)}${note ? `<small>${esc(note)}</small>` : ''}</span><span class="l"></span><span class="p">€ ${esc(price)}</span></div>`
        ).join('');
        return `<section class="card" style="flex-grow:${section.items.length}"><h2>${esc(section.title)}</h2><div class="rows">${rows}</div></section>`;
    }

    /* Lange namen (bijv. "Broodje hamburger speciaal") iets verkleinen tot ze op één regel passen */
    function fitRows() {
        document.querySelectorAll('.row').forEach(row => {
            const n = row.querySelector('.n'), p = row.querySelector('.p');
            const avail = row.clientWidth - p.offsetWidth - 80;
            let fs = 52;
            n.style.fontSize = '';
            while (n.scrollWidth > avail && fs > 36) { fs -= 1; n.style.fontSize = fs + 'px'; }
            n.style.whiteSpace = n.scrollWidth > avail ? 'normal' : '';
        });
    }

    function eventHTML(ev) {
        const pills = ev.prices.map(([who, price]) =>
            `<span class="pill">${esc(who)} <b>€ ${esc(price)}</b></span>`).join('');
        return `<section class="card event">
            <div class="label">${esc(ev.label)}</div>
            <h2>${esc(ev.title)}</h2>
            <div class="when">${esc(ev.when)}</div>
            <div class="prices">${pills}</div>
            ${ev.note ? `<div class="note">${esc(ev.note)}</div>` : ''}
        </section>`;
    }

    document.getElementById('colLeft').innerHTML =
        MENU.left.map(cardHTML).join('') + (EVENT.show ? eventHTML(EVENT) : '');
    document.getElementById('colRight').innerHTML = MENU.right.map(cardHTML).join('');
    fitRows();
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitRows);

    /* ── Stage schalen naar het scherm (optioneel ?rotate=90|180|270) ── */
    const rotate = ((parseInt(params.get('rotate') || '0', 10) || 0) % 360 + 360) % 360;

    function fit() {
        const sideways = rotate === 90 || rotate === 270;
        const sw = sideways ? H : W, sh = sideways ? W : H;
        const s = Math.min(innerWidth / sw, innerHeight / sh);
        const tx = (innerWidth - sw * s) / 2, ty = (innerHeight - sh * s) / 2;
        let t = `translate(${tx}px, ${ty}px) scale(${s})`;
        if (rotate === 90) t += ` translate(${H}px, 0) rotate(90deg)`;
        else if (rotate === 180) t += ` translate(${W}px, ${H}px) rotate(180deg)`;
        else if (rotate === 270) t += ` translate(0, ${W}px) rotate(-90deg)`;
        stage.style.transform = t;
    }
    addEventListener('resize', fit);
    fit();

    /* ── Tijd: live, vast (?t=21:30 of ?t=2026-12-21T16:00) of demo (?demo) ── */
    let mode = 'live', fixed = null;
    const demoStart = Date.now();
    const tParam = params.get('t');
    if (tParam) {
        let d;
        if (/^\d{1,2}:\d{2}$/.test(tParam)) {
            const [h, m] = tParam.split(':').map(Number);
            d = new Date(); d.setHours(h, m, 0, 0);
        } else {
            d = new Date(tParam);
        }
        if (!isNaN(d)) { fixed = d; mode = 'fixed'; }
    }
    if (params.has('demo')) mode = 'demo';

    function now() {
        if (mode === 'fixed') return new Date(fixed);
        if (mode === 'demo') {
            const base = new Date(); base.setHours(4, 0, 0, 0);
            const elapsed = ((Date.now() - demoStart) * 900) % 86400000; /* 15 min per seconde */
            return new Date(base.getTime() + elapsed);
        }
        return new Date();
    }

    /* ── Zon en maan (naar SunCalc, Vladimir Agafonkin, BSD) ───── */
    const rad = Math.PI / 180, DEG = 180 / Math.PI;
    const dayMs = 86400000, J1970 = 2440588, J2000 = 2451545, e = rad * 23.4397;
    const toDays = date => date / dayMs - 0.5 + J1970 - J2000;
    const rightAscension = (l, b) => Math.atan2(Math.sin(l) * Math.cos(e) - Math.tan(b) * Math.sin(e), Math.cos(l));
    const declination = (l, b) => Math.asin(Math.sin(b) * Math.cos(e) + Math.cos(b) * Math.sin(e) * Math.sin(l));
    const azimuth = (Hh, phi, dec) => Math.atan2(Math.sin(Hh), Math.cos(Hh) * Math.sin(phi) - Math.tan(dec) * Math.cos(phi));
    const altitude = (Hh, phi, dec) => Math.asin(Math.sin(phi) * Math.sin(dec) + Math.cos(phi) * Math.cos(dec) * Math.cos(Hh));
    const siderealTime = (d, lw) => rad * (280.16 + 360.9856235 * d) - lw;

    function sunCoords(d) {
        const M = rad * (357.5291 + 0.98560028 * d);
        const L = M + rad * (1.9148 * Math.sin(M) + 0.02 * Math.sin(2 * M) + 0.0003 * Math.sin(3 * M)) + rad * 102.9372 + Math.PI;
        return { dec: declination(L, 0), ra: rightAscension(L, 0) };
    }

    function moonCoords(d) {
        const L = rad * (218.316 + 13.176396 * d), M = rad * (134.963 + 13.064993 * d), F = rad * (93.272 + 13.229350 * d);
        const l = L + rad * 6.289 * Math.sin(M), b = rad * 5.128 * Math.sin(F), dt = 385001 - 20905 * Math.cos(M);
        return { ra: rightAscension(l, b), dec: declination(l, b), dist: dt };
    }

    function position(date, coords) {
        const lw = rad * -LON, phi = rad * LAT, d = toDays(date), c = coords(d), Hh = siderealTime(d, lw) - c.ra;
        const az = ((azimuth(Hh, phi, c.dec) * DEG + 180) % 360 + 360) % 360;   /* 0 = noord, 90 = oost */
        return { az, alt: altitude(Hh, phi, c.dec) * DEG };
    }
    const sunPosition = date => position(date, sunCoords);
    const moonPosition = date => position(date, moonCoords);

    function moonPhase(date) {
        const d = toDays(date), s = sunCoords(d), m = moonCoords(d), sdist = 149598000;
        const phi = Math.acos(Math.sin(s.dec) * Math.sin(m.dec) + Math.cos(s.dec) * Math.cos(m.dec) * Math.cos(s.ra - m.ra));
        const inc = Math.atan2(sdist * Math.sin(phi), m.dist - sdist * Math.cos(phi));
        const angle = Math.atan2(Math.cos(s.dec) * Math.sin(s.ra - m.ra),
            Math.sin(s.dec) * Math.cos(m.dec) - Math.cos(s.dec) * Math.sin(m.dec) * Math.cos(s.ra - m.ra));
        return 0.5 + 0.5 * inc * (angle < 0 ? -1 : 1) / Math.PI;
    }

    const sunTimesCache = {};
    function sunTimes(date) {
        const key = date.toDateString();
        if (sunTimesCache[key]) return sunTimesCache[key];
        const d0 = new Date(date); d0.setHours(0, 0, 0, 0);
        let rise = null, set = null, prev = null;
        for (let m = 0; m <= 1440; m += 2) {
            const t = new Date(d0.getTime() + m * 60000);
            const a = sunPosition(t).alt;
            if (prev !== null) {
                if (prev < -0.833 && a >= -0.833) rise = t;
                if (prev >= -0.833 && a < -0.833) set = t;
            }
            prev = a;
        }
        return (sunTimesCache[key] = { rise, set });
    }

    /* ── Kleuren ───────────────────────────────────────────────── */
    const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
    const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
    const toHex = c => '#' + c.map(v => Math.round(clamp(v, 0, 255)).toString(16).padStart(2, '0')).join('');
    const mix = (a, b, f) => toHex(hex(a).map((v, i) => v + (hex(b)[i] - v) * f));
    const rgba = (h, a) => { const [r, g, b] = hex(h); return `rgba(${r},${g},${b},${a.toFixed(3)})`; };

    /* [zonshoogte °, zenit, midden, horizon, bord boven, bord onder] */
    const SKY = [
        [-18, '#050a1a', '#0a1228', '#121c36', '#0b111b', '#04060b'],
        [-12, '#0a1330', '#161e48', '#2d3264', '#0f1522', '#070a11'],
        [ -7, '#162350', '#31366e', '#5c3f74', '#131b2a', '#0a0e17'],
        [ -3, '#243a76', '#5d5290', '#b85d78', '#1a2433', '#0f151f'],
        [  0, '#335796', '#7d6f9e', '#f08a4c', '#212f3d', '#141c27'],
        [  4, '#4374ad', '#8ca3c8', '#f5c47c', '#2a3946', '#1a2530'],
        [ 10, '#3e7fbe', '#8dbbdd', '#e8dcb6', '#334450', '#202c36'],
        [ 22, '#3477ba', '#84b9df', '#bddcf0', '#3a4c58', '#25333c'],
        [ 65, '#2c6fb5', '#7db3dd', '#b6daef', '#3c4e5a', '#27353e'],
    ];

    function skyColours(alt) {
        if (alt <= SKY[0][0]) return SKY[0].slice(1);
        if (alt >= SKY[SKY.length - 1][0]) return SKY[SKY.length - 1].slice(1);
        for (let i = 0; i < SKY.length - 1; i++) {
            const a = SKY[i], b = SKY[i + 1];
            if (alt >= a[0] && alt <= b[0]) {
                const f = (alt - a[0]) / (b[0] - a[0]);
                return a.slice(1).map((c, j) => mix(c, b[j + 1], f));
            }
        }
        return SKY[SKY.length - 1].slice(1);
    }

    function sunColour(alt) {
        if (alt > 15) return '#fff3c9';
        if (alt > 4) return mix('#ffcf6a', '#fff3c9', (alt - 4) / 11);
        return mix('#ff7538', '#ffcf6a', clamp((alt + 2) / 6, 0, 1));
    }

    /* ── Sterren (vaste seed, dus elke keer dezelfde hemel) ─────── */
    (function buildStars() {
        let a = 53416867;
        const rnd = () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
        let s = '';
        for (let i = 0; i < 190; i++) {
            const x = rnd() * W, y = Math.pow(rnd(), 1.35) * (SKY_H - 130);
            const bright = rnd() < 0.12;
            const r = bright ? 2.6 + rnd() * 1.4 : 1.2 + rnd() * 1.4;
            const o = 0.45 + rnd() * 0.5;
            const tw = rnd() < 0.25;
            s += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r.toFixed(1)}" opacity="${o.toFixed(2)}"${tw ? ` class="tw" style="animation-delay:${(-rnd() * 6).toFixed(2)}s"` : ''}/>`;
        }
        starsEl.innerHTML = s;
    })();

    function drawMoon(p) {
        const r = 44, t = Math.cos(2 * Math.PI * p), rx = Math.max(0.5, Math.abs(t) * r);
        const d = p < 0.5
            ? `M0,${-r} A${r},${r} 0 0 1 0,${r} A${rx.toFixed(2)},${r} 0 0 ${t > 0 ? 0 : 1} 0,${-r} Z`
            : `M0,${-r} A${r},${r} 0 0 0 0,${r} A${rx.toFixed(2)},${r} 0 0 ${t > 0 ? 1 : 0} 0,${-r} Z`;
        moonLit.setAttribute('d', d);
    }

    const fmtTime = d => d ? d.toLocaleTimeString('nl-NL', { hour: '2-digit', minute: '2-digit' }) : '--:--';
    const fmtDate = d => d.toLocaleDateString('nl-NL', { weekday: 'long', day: 'numeric', month: 'long' });

    /* Azimut 40°..320° (NO tot NW) → volle breedte; hoogte 0..62° → horizon tot boven */
    const skyX = az => clamp((az - 40) / 280, -0.06, 1.06) * W;
    const skyY = alt => SKY_H - (alt / 62) * (SKY_H - SUN_TOP);

    let lastSkyMinute = -1;
    function render() {
        const t = now();
        timeEl.textContent = fmtTime(t);

        const minute = Math.floor(t.getTime() / 60000);
        if (minute === lastSkyMinute && mode !== 'demo') return;
        lastSkyMinute = minute;

        dateEl.textContent = fmtDate(t);
        const st = sunTimes(t);
        suntimesEl.textContent = `zon op ${fmtTime(st.rise)} · zon onder ${fmtTime(st.set)}`;

        const sun = sunPosition(t);
        const [zen, mid, hor, gTop, gBot] = skyColours(sun.alt);
        stage.style.setProperty('--ground-top', gTop);
        stage.style.setProperty('--ground-bottom', gBot);
        document.body.style.background = gBot;

        const sx = skyX(sun.az), sy = skyY(sun.alt);
        const sc = sunColour(sun.alt);
        const low = 1 - clamp(sun.alt, 0, 18) / 18;
        const glowA = (0.26 + 0.36 * low) * clamp((sun.alt + 7) / 7, 0, 1);
        const glowR = 520 + 520 * low;
        const glow = glowA > 0.005
            ? `radial-gradient(circle ${glowR.toFixed(0)}px at ${sx.toFixed(0)}px ${sy.toFixed(0)}px, ${rgba(sc, glowA)} 0%, ${rgba(sc, glowA * 0.45)} 40%, ${rgba(sc, 0)} 100%), `
            : '';
        skyEl.style.background = `${glow}linear-gradient(to bottom, ${zen} 0%, ${mid} 55%, ${hor} 100%)`;

        sunEl.style.transform = `translate(${(sx - 65).toFixed(1)}px, ${(sy - 65).toFixed(1)}px)`;
        sunEl.style.background = sc;
        sunEl.style.boxShadow = `0 0 40px 14px ${rgba(sc, 0.55)}, 0 0 170px 60px ${rgba(sc, 0.22)}`;
        sunEl.style.opacity = clamp((sun.alt + 3.5) / 3.5, 0, 1).toFixed(3);

        starsEl.style.opacity = clamp((-sun.alt - 3) / 11, 0, 1).toFixed(3);

        const moon = moonPosition(t);
        const mx = skyX(moon.az), my = skyY(moon.alt);
        moonEl.style.transform = `translate(${(mx - 45).toFixed(1)}px, ${(my - 45).toFixed(1)}px)`;
        moonEl.style.opacity = (clamp((-sun.alt + 1) / 9, 0, 1) * clamp((moon.alt + 2) / 4, 0, 1)).toFixed(3);
        drawMoon(moonPhase(t));
    }

    render();
    setInterval(render, mode === 'demo' ? 100 : 1000);

    /* Elke 20 minuten herladen zodat nieuwe prijzen vanzelf verschijnen */
    if (mode === 'live') setTimeout(() => location.reload(), 20 * 60 * 1000);
})();
</script>
</body>
</html>
